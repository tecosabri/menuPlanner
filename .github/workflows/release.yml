name: Release Tagger

on:
  push:
    branches:
      - main

jobs:
  tag_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create Release Tag
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date();
            const tagName = `v${date.getFullYear()}.${date.getMonth() + 1}.${date.getDate()}-${date.getHours()}${date.getMinutes()}`;
            
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tagName}`,
                sha: context.sha
              });
              console.log(`Tag created: ${tagName}`);
            } catch (error) {
              console.log('Error creating tag (might exist):', error);
            }
